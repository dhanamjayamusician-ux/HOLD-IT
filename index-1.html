<!-- HOLD IT v1.0 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>HOLD IT</title>
  <link rel="stylesheet" href="style.css" />

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Camera feed -->
  <video id="video" playsinline></video>

  <!-- Landmark canvas -->
  <canvas id="canvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-name">HOLD <span>IT</span></div>
    <div id="hud-count">
      <span id="hand-number">0</span>
      hands
    </div>
    <div id="hud-status">show your hands</div>
  </div>

  <!-- Loading state -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Initialising camera</div>
  </div>

  <!-- Permission / entry screen -->
  <div id="permission-screen">
    <div class="logo">HOLD <span>IT</span></div>
    <div class="tagline">Real-time hand tracking</div>
    <button id="start-btn">Enable Camera</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
