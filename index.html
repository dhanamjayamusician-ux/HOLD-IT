<!-- HOLD IT v1.1 — github pages optimised -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>HOLD IT</title>
<script src="https://unpkg.com/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js" crossorigin="anonymous"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Syne:wght@800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#00ff88;--c:#00ccff;--bg:#0a0a0a;--w:#f0f0f0;--dim:rgba(240,240,240,0.45)}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Space Mono',monospace}
#video{position:absolute;inset:0;width:100vw;height:100vh;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .6s ease}
#video.on{opacity:1}
#canvas{position:absolute;inset:0;width:100vw;height:100vh;transform:scaleX(-1)}
#perm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:10;gap:20px;transition:opacity .5s ease}
#perm.gone{opacity:0;pointer-events:none}
.logo{font-family:'Syne',sans-serif;font-size:clamp(52px,12vw,100px);font-weight:800;color:var(--w);letter-spacing:-3px;line-height:1}
.logo em{color:var(--g);font-style:normal}
.tag{font-size:11px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase}
#go{margin-top:12px;background:transparent;border:1px solid var(--g);color:var(--g);font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.1em;padding:13px 38px;cursor:pointer;text-transform:uppercase;transition:background .2s,color .2s}
#go:hover{background:var(--g);color:#0a0a0a}
#err{font-size:12px;color:#ff4455;letter-spacing:.04em;display:none;text-align:center;max-width:300px;line-height:1.6}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:8;gap:18px;opacity:0;pointer-events:none;transition:opacity .3s}
#load.on{opacity:1;pointer-events:all}
.spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,255,136,.15);border-top-color:var(--g);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-size:11px;color:var(--dim);letter-spacing:.15em;text-transform:uppercase}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .6s ease}
#hud.on{opacity:1}
#hud-name{position:absolute;top:22px;left:24px;font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--w);letter-spacing:-.5px}
#hud-name em{color:var(--g);font-style:normal}
#hud-count{position:absolute;top:22px;right:24px;font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;text-align:right}
#hn{display:block;font-family:'Syne',sans-serif;font-size:44px;font-weight:800;color:var(--g);line-height:1;text-align:right}
#hud-status{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px)}
</style>
</head>
<body>

<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<div id="hud">
  <div id="hud-name">HOLD <em>IT</em></div>
  <div id="hud-count"><span id="hn">0</span>hands</div>
  <div id="hud-status">show your hands</div>
</div>

<div id="load">
  <div class="spin"></div>
  <div class="ltxt">Initialising camera</div>
</div>

<div id="perm">
  <div class="logo">HOLD <em>IT</em></div>
  <div class="tag">Real-time hand tracking</div>
  <button id="go">Enable Camera</button>
  <div id="err"></div>
</div>

<script>
const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const perm   = document.getElementById('perm');
const goBtn  = document.getElementById('go');
const errEl  = document.getElementById('err');
const hud    = document.getElementById('hud');
const load   = document.getElementById('load');
const statusEl = document.getElementById('hud-status');
const hn     = document.getElementById('hn');

function resize(){
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function setCount(n){
  hn.textContent = n;
  statusEl.textContent = n === 0 ? 'show your hands'
    : n === 1 ? 'hand detected'
    : 'both hands detected';
}

function onResults(results){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if(!results.multiHandLandmarks || results.multiHandLandmarks.length === 0){
    setCount(0); return;
  }
  setCount(results.multiHandLandmarks.length);
  for(const lm of results.multiHandLandmarks){
    drawConnectors(ctx, lm, HAND_CONNECTIONS, {color:'#00ccff', lineWidth:1.5});
    drawLandmarks(ctx, lm, {
      color:'#00ff88', fillColor:'#00ff88', lineWidth:0,
      radius: d => [4,8,12,16,20].includes(d.index) ? 5 : 3
    });
  }
}

async function start(){
  load.classList.add('on');
  perm.classList.add('gone');
  errEl.style.display = 'none';

  try {
    const hands = new Hands({
      locateFile: f => `https://unpkg.com/@mediapipe/hands@0.4.1646424915/${f}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6
    });
    hands.onResults(onResults);

    const cam = new Camera(video, {
      onFrame: async () => { await hands.send({image: video}); },
      width: 1280,
      height: 720
    });
    await cam.start();

    video.classList.add('on');
    hud.classList.add('on');
    load.classList.remove('on');
    setCount(0);

  } catch(e){
    load.classList.remove('on');
    perm.classList.remove('gone');
    errEl.style.display = 'block';
    errEl.textContent =
      e.name === 'NotAllowedError' ? 'Camera access denied — allow it and retry.' :
      e.name === 'NotFoundError'   ? 'No camera detected on this device.' :
      'Failed to load. Check your connection and refresh.';
    console.error(e);
  }
}

goBtn.addEventListener('click', start);
</script>
</body>
</html>
